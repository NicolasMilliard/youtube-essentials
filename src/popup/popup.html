<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./popup.css" />
    <title>YouTube Essentials</title>
  </head>

  <body>
    <main class="popup">
      <header class="popup__header">
        <div>
          <h1>YouTube Essentials</h1>
          <p>YouTube, minus the noise.</p>
        </div>

        <fieldset class="theme-selector">
          <legend class="sr-only">Popup theme</legend>

          <div class="theme-options">
            <label title="System theme">
              <input type="radio" name="theme" value="system" aria-label="System theme" />
              <span class="theme-option">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <rect x="3" y="4" width="18" height="13" rx="2"></rect>
                  <path d="M8 21h8M12 17v4"></path>
                </svg>
              </span>
            </label>

            <label title="Light theme">
              <input type="radio" name="theme" value="light" aria-label="Light theme" />
              <span class="theme-option">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="3.5"></circle>
                  <path
                    d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"
                  ></path>
                </svg>
              </span>
            </label>

            <label title="Dark theme">
              <input type="radio" name="theme" value="dark" aria-label="Dark theme" />
              <span class="theme-option">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M20.5 14.2A8.2 8.2 0 0 1 9.8 3.5a8.2 8.2 0 1 0 10.7 10.7Z"></path>
                </svg>
              </span>
            </label>
          </div>
        </fieldset>
      </header>

      <section class="panel">
        <div class="panel__header">
          <h2>Content</h2>
        </div>

        <div class="setting-row">
          <label class="setting-row__content" for="hide-shorts">
            <span id="hide-shorts-label" class="setting-row__label">Hide Shorts</span>
          </label>

          <label class="switch">
            <input id="hide-shorts" type="checkbox" aria-labelledby="hide-shorts-label" />
            <span class="switch__control"></span>
          </label>
        </div>

        <div class="setting-row setting-row--nested">
          <label class="setting-row__content" for="allow-shorts-on-channels">
            <span id="allow-shorts-on-channels-label" class="setting-row__label">
              Allow on channels
            </span>
            <span id="allow-shorts-on-channels-description" class="setting-row__description">
              Keep Shorts available on creator pages.
            </span>
          </label>

          <label class="switch">
            <input
              id="allow-shorts-on-channels"
              type="checkbox"
              aria-labelledby="allow-shorts-on-channels-label"
            />
            <span class="switch__control"></span>
          </label>
        </div>

        <div class="setting-row">
          <label class="setting-row__content" for="hide-playables">
            <span id="hide-playables-label" class="setting-row__label">Hide Playables</span>
          </label>

          <label class="switch">
            <input id="hide-playables" type="checkbox" aria-labelledby="hide-playables-label" />
            <span class="switch__control"></span>
          </label>
        </div>

        <div class="setting-row">
          <label class="setting-row__content" for="hide-yt-featured">
            <span id="hide-yt-featured-label" class="setting-row__label">Hide Featured videos</span>
          </label>

          <label class="switch">
            <input id="hide-yt-featured" type="checkbox" aria-labelledby="hide-yt-featured-label" />
            <span class="switch__control"></span>
          </label>
        </div>

        <div class="setting-row">
          <label class="setting-row__content" for="quiet-watch">
            <span id="quiet-watch-label" class="setting-row__label">Quiet watch</span>
            <span id="quiet-watch-description" class="setting-row__description">
              Hide the watch sidebar and recommendations.
            </span>
          </label>

          <label class="switch">
            <input
              id="quiet-watch"
              type="checkbox"
              aria-labelledby="quiet-watch-label"
              aria-describedby="quiet-watch-description"
            />
            <span class="switch__control"></span>
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="panel__header">
          <h2>Home</h2>
        </div>

        <div class="setting-row">
          <label class="setting-row__content" for="redirect-home">
            <span id="redirect-home-label" class="setting-row__label"
              >Open Subscriptions by default</span
            >
            <span id="redirect-home-description" class="setting-row__description">
              Open YouTube on your Subscriptions feed.
            </span>
          </label>

          <label class="switch">
            <input
              id="redirect-home"
              type="checkbox"
              aria-labelledby="redirect-home-label"
              aria-describedby="redirect-home-description"
            />
            <span class="switch__control"></span>
          </label>
        </div>
      </section>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
